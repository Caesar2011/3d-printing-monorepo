<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="toolbar" class="toolbar">
  <div class="toolbar-group">
    <button class="btn" id="btn-theme" title="Toggle dark/light mode (T)">
      <svg id="icon-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-3a1 1 0 01-1-1V1a1 1 0 112 0v2a1 1 0 01-1 1zm0 18a1 1 0 01-1-1v-2a1 1 0 112 0v2a1 1 0 01-1 1zm9-9h-2a1 1 0 110-2h2a1 1 0 110 2zM6 12a1 1 0 01-1 1H3a1 1 0 110-2h2a1 1 0 011 1zm12.36-5.64a1 1 0 01-.7-.3l-1.42-1.42a1 1 0 111.41-1.41l1.42 1.42a1 1 0 01-.71 1.7zM7.05 18.36a1 1 0 01-.7-.3l-1.42-1.42a1 1 0 111.41-1.41l1.42 1.42a1 1 0 01-.71 1.7zm11.31 0a1 1 0 01-.71-1.71l1.42-1.42a1 1 0 111.41 1.41l-1.42 1.42a1 1 0 01-.7.3zM7.05 7.05a1 1 0 01-.71-.29L4.93 5.34a1 1 0 011.41-1.41L7.76 5.35a1 1 0 01-.71 1.7z"/></svg>
      <svg id="icon-moon" viewBox="0 0 24 24" style="display:none"><path d="M21.64 13A9 9 0 0111 2.36 10 10 0 1021.64 13z"/></svg>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-fit" title="Fit model to view (F)">
      <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 0h2v6h-6v-2h4v-4z"/></svg>
    </button>
    <button class="btn" id="btn-fit-anim" title="Fit model animated (Shift+F)">
      <svg viewBox="0 0 24 24"><path d="M3 3h6v2H5v4H3V3zm12 0h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 0h2v6h-6v-2h4v-4z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-projection" title="Perspective / Orthographic (P)">
      <span class="btn-label" id="proj-label">P</span>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-navmode" title="Fixed Up / Free Orbit (O)" data-active="false">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><path d="M12 6l-4 4h3v4h2v-4h3z"/></svg>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-flipup" title="Flip up vector (U)">
      <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5H7z"/><path d="M7 18l5-5 5 5H7z" opacity="0.4"/></svg>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-edges" title="Toggle edges (E)" data-active="false">
      <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3V3zm2 2v14h14V5H5z" fill-rule="evenodd"/></svg>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-mode" title="Toggle WebSocket / 3MF mode (M)" data-active="false">
      <span class="btn-label" id="mode-label">WS</span>
    </button>
  </div>
  <div class="toolbar-group">
    <button class="btn" id="btn-help" title="Keyboard shortcuts (?)">
      <span class="btn-label">?</span>
    </button>
  </div>
</div>

<div id="view-toolbar" class="toolbar">
  <button class="btn" id="btn-view-home" title="Home view (0)">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </button>
  <button class="btn" id="btn-view-front" title="Front view (1)"><span class="btn-label">F</span></button>
  <button class="btn" id="btn-view-back" title="Back view (2)"><span class="btn-label">Bk</span></button>
  <button class="btn" id="btn-view-top" title="Top view (3)"><span class="btn-label">T</span></button>
  <button class="btn" id="btn-view-bottom" title="Bottom view (4)"><span class="btn-label">Bt</span></button>
  <button class="btn" id="btn-view-right" title="Right view (5)"><span class="btn-label">R</span></button>
  <button class="btn" id="btn-view-left" title="Left view (6)"><span class="btn-label">L</span></button>
</div>

<div id="help-panel">
  <h4>Keyboard Shortcuts</h4>
  <div><kbd>F</kbd> Fit to view</div>
  <div><kbd>Shift+F</kbd> Fit (animated)</div>
  <div><kbd>P</kbd> Perspective / Ortho</div>
  <div><kbd>O</kbd> Orbit mode</div>
  <div><kbd>U</kbd> Flip up vector</div>
  <div><kbd>E</kbd> Toggle edges</div>
  <div><kbd>M</kbd> Toggle WS / 3MF mode</div>
  <div><kbd>T</kbd> Toggle theme</div>
  <div><kbd>0</kbd> Home view</div>
  <div><kbd>1-6</kbd> View presets</div>
  <div><kbd>?</kbd> This help</div>
</div>

<div id="ws-indicator" class="indicator" title="WebSocket status"></div>
<div id="mode-indicator" class="indicator" title="Render mode"></div>
<div id="status">Ready</div>
<div id="viewer"></div>

<script src="o3dv.min.js"></script>
<script type="module" src="viewer.mjs"></script>
</body>
</html>
